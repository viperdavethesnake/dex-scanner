services:

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: dex-llamacpp
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=1
    command: >
      --model /models/gguf/custom/Qwen_Qwen3.6-35B-A3B-Q6_K.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 65536
      --n-gpu-layers 999
      --jinja
      --flash-attn off
      --cache-type-k q8_0
    volumes:
      - source: /space/docker/containers/ai-models
        target: /models
        type: bind
        read_only: true
    devices:
      - nvidia.com/gpu=all
    networks:
      macvlan_net:
        ipv4_address: 192.168.33.231
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dex-timescale
    restart: unless-stopped
    network_mode: service:llamacpp
    depends_on:
      llamacpp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dex -d dex_signals || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - POSTGRES_DB=dex_signals
      - POSTGRES_USER=dex
      - POSTGRES_PASSWORD=dexsignals
    volumes:
      - source: ./timescale_data
        target: /var/lib/postgresql/data
        type: bind
      - source: ./init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        type: bind
        read_only: true

  n8n:
    image: n8nio/n8n:latest
    container_name: dex-n8n
    restart: unless-stopped
    network_mode: service:llamacpp
    depends_on:
      llamacpp:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      - N8N_HOST=192.168.33.231
      - WEBHOOK_URL=http://192.168.33.231:5678
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_API_KEY=dex-n8n-key
      - GENERIC_TIMEZONE=America/New_York
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - source: ./n8n_data
        target: /home/node/.n8n
        type: bind
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dex-collector-db:
    image: timescale/timescaledb:latest-pg16
    container_name: dex-collector-db
    restart: unless-stopped
    command: postgres -c idle_in_transaction_session_timeout=60000
    networks:
      - dex-collector-net
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=collector_signals
      - POSTGRES_USER=collector
      - POSTGRES_PASSWORD=collector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector_signals || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - source: ./collector_data
        target: /var/lib/postgresql/data
        type: bind
      - source: ./collector/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        type: bind
        read_only: true

  dex-collector:
    build:
      context: ./collector
    pull_policy: never
    container_name: dex-collector
    restart: unless-stopped
    networks:
      - dex-collector-net
    depends_on:
      dex-collector-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,time; exit(0 if os.path.exists('/tmp/heartbeat') and time.time()-os.path.getmtime('/tmp/heartbeat')<660 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 360s
    env_file:
      - .env
    environment:
      - DB_HOST=dex-collector-db
      - DB_PORT=5432
      - DB_NAME=collector_signals
      - DB_USER=collector
      - DB_PASS=collector
      - POLL_INTERVAL=300
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY}

  dex-trader-db:
    image: timescale/timescaledb:latest-pg16
    container_name: dex-trader-db
    restart: unless-stopped
    networks:
      - dex-trader-net
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=trader
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trader
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - source: ./trader_data
        target: /var/lib/postgresql/data
        type: bind
      - source: ./dex-trader/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        type: bind
        read_only: true

  dex-trader:
    build:
      context: .
      dockerfile: dex-trader/Dockerfile
    pull_policy: never
    container_name: dex-trader
    restart: unless-stopped
    networks:
      - dex-trader-net
      - dex-collector-net
    depends_on:
      dex-trader-db:
        condition: service_healthy
      dex-collector-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SHADOW_MODE=true
      - TRADER_DB_HOST=dex-trader-db
      - TRADER_DB_PORT=5432
      - TRADER_DB_NAME=trader
      - TRADER_DB_USER=trader
      - TRADER_DB_PASS=trader
      - COLLECTOR_DB_HOST=dex-collector-db
      - COLLECTOR_DB_PORT=5432
      - COLLECTOR_DB_NAME=collector_signals
      - COLLECTOR_DB_USER=collector
      - COLLECTOR_DB_PASS=collector
      - MODEL_PATH=/models/lgbm_base.txt
      - FEATURES_PATH=/models/feature_list.json
      - METADATA_PATH=/models/metadata.json
      - POLL_INTERVAL=5
      - TRADE_SIZE_USD=50
      - MAX_POSITIONS=3
      - DAILY_LOSS_CAP_USD=50.0
      - MAX_TRADES_PER_HOUR=20
      - REENTRY_LOCKOUT_MINUTES=30
      - CONVICTION_THRESHOLD_SHADOW=0.65
      - CONVICTION_THRESHOLD_LIVE=0.70
      - POSITION_HOLD_SECONDS=300
      - QUOTE_DRIFT_MAX_PCT=3.0
      - SLIPPAGE_REJECT_BPS=500
      - SECURITY_FAIL_OPEN=true
      - ETH_USD_PRICE_URL=https://api.coinbase.com/v2/prices/ETH-USD/spot
      - ETH_USD_CACHE_SECONDS=600
      - HEALTH_PORT=8090
    volumes:
      - source: ./analysis/models
        target: /models
        type: bind
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  macvlan_net:
    external: true
  dex-collector-net:
    driver: bridge
  dex-trader-net:
    driver: bridge
